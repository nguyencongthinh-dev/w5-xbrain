AWSTemplateFormatVersion: '2010-09-09'
Description: 'W5 Network Fortress: Production-Ready, Free-Tier Compliant AWS Architecture'

Parameters:
  EnvironmentName:
    Type: String
    Default: w5-fortress
    Description: Environment name prefix for resources

  AllowedSSHCIDR:
    Type: String
    Default: 192.0.2.0/24
    Description: Trusted CIDR range allowed to SSH into Bastion Host (e.g., your public IP, do not use 0.0.0.0/0 in production)

  ModelId:
    Type: String
    Default: amazon.nova-micro-v1:0
    Description: Amazon Bedrock model ID to invoke (e.g., amazon.nova-micro-v1:0, anthropic.claude-3-5-haiku-20241022-v1:0)

  LatestAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64'
    Description: Amazon Linux 2023 AMI SSM parameter

  KeyName:
    Type: String
    Default: ''
    Description: Optional EC2 Key Pair name for SSH access. Leave blank if not using Key Pairs (EC2 Instance Connect can be used instead).

  NotificationEmail:
    Type: String
    Default: 'nguyencongthinh.dev@gmail.com'
    Description: Email address to send cost budget notifications to

Conditions:
  HasKeyName: !Not [!Equals [!Ref KeyName, '']]

Resources:
  # =========================================================================
  # MH1: VPC, Subnets, and Observability (VPC Flow Logs)
  # =========================================================================
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-vpc'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-igw'

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-public-sn-1'

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-public-sn-2'

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-private-sn-1'

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.12.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-private-sn-2'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-public-rt'

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-private-rt'

  # Note: No PrivateRoute to Internet/NAT Gateway. This keeps costs at $0 and aligns with Path B.

  PublicSubnet1Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateSubnet1Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable
        - !Ref PublicRouteTable

  DynamoDbEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.dynamodb'
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable
        - !Ref PublicRouteTable


  # VPC Flow Logs Logging Config
  VpcFlowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/vpc/flowlogs/${EnvironmentName}'
      RetentionInDays: 7

  FlowLogsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: VPCFlowLogsPublishPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource: '*'

  VpcFlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      DeliverLogsPermissionArn: !GetAtt FlowLogsRole.Arn
      LogGroupName: !Ref VpcFlowLogGroup
      ResourceId: !Ref Vpc
      ResourceType: VPC
      TrafficType: ALL

  # =========================================================================
  # MH2: Network Security Hardening (Security Groups + Hardened NACL)
  # =========================================================================
  BastionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security Group for Bastion Host in Public Subnet
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedSSHCIDR
          Description: Allow SSH only from trusted IP CIDR range
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-bastion-sg'

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security Group for Private App Host
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourceSecurityGroupId: !Ref BastionSecurityGroup
          Description: Allow SSH only from Bastion Host
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-app-sg'

  EfsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security Group for EFS Mount Targets
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref AppSecurityGroup
          Description: Allow NFS access only from Private App SG
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-efs-sg'

  # Hardened NACL for Private Subnets
  PrivateNacl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-private-nacl'

  # Negative Security Test: Rule to block traffic from a specific subnet/IP range
  NaclDenyRule:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PrivateNacl
      RuleNumber: 90
      Protocol: 6  # TCP
      RuleAction: deny
      Egress: false
      CidrBlock: 198.51.100.0/24  # RFC 5737 Test-net-2 CIDR, simulating blocked subnet
      PortRange:
        From: 0
        To: 65535

  NaclAllowInbound:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PrivateNacl
      RuleNumber: 100
      Protocol: -1 # All protocols
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0

  NaclAllowOutbound:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PrivateNacl
      RuleNumber: 100
      Protocol: -1 # All protocols
      RuleAction: allow
      Egress: true
      CidrBlock: 0.0.0.0/0

  PrivateSubnet1NaclAssociation:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      NetworkAclId: !Ref PrivateNacl

  PrivateSubnet2NaclAssociation:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      NetworkAclId: !Ref PrivateNacl

  # =========================================================================
  # MH3: File Storage Layer + Backup Plan
  # =========================================================================
  EfsFileSystem:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
      ThroughputMode: elastic
      LifecyclePolicies:
        - TransitionToIA: AFTER_30_DAYS
      FileSystemTags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-efs'

  EfsMountTarget1:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref EfsFileSystem
      SubnetId: !Ref PrivateSubnet1
      SecurityGroups:
        - !Ref EfsSecurityGroup

  EfsMountTarget2:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref EfsFileSystem
      SubnetId: !Ref PrivateSubnet2
      SecurityGroups:
        - !Ref EfsSecurityGroup

  # AWS Backup configuration
  BackupVault:
    Type: AWS::Backup::BackupVault
    Properties:
      BackupVaultName: !Sub '${EnvironmentName}-backup-vault'

  BackupRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: backup.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForBackup
        - arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForRestores

  BackupPlan:
    Type: AWS::Backup::BackupPlan
    Properties:
      BackupPlan:
        BackupPlanName: !Sub '${EnvironmentName}-backup-plan'
        BackupPlanRule:
          - RuleName: DailyBackupRule
            TargetBackupVault: !Ref BackupVault
            ScheduleExpression: cron(0 5 * * ? *) # Daily at 05:00 UTC
            StartWindowMinutes: 60
            CompletionWindowMinutes: 120
            Lifecycle:
              DeleteAfterDays: 7

  BackupSelection:
    Type: AWS::Backup::BackupSelection
    Properties:
      BackupPlanId: !Ref BackupPlan
      BackupSelection:
        SelectionName: W5ResourceSelection
        IamRoleArn: !GetAtt BackupRole.Arn
        Resources:
          - !Sub 'arn:aws:elasticfilesystem:${AWS::Region}:${AWS::AccountId}:file-system/${EfsFileSystem}'
          - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoDbTable}'

  DynamoDbTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${EnvironmentName}-chat-logs'
      AttributeDefinitions:
        - AttributeName: chat_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: N
      KeySchema:
        - AttributeName: chat_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-chat-logs'

  # EC2 Instances
  BastionInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro # Free Tier eligible in many regions
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref PublicSubnet1
      SecurityGroupIds:
        - !Ref BastionSecurityGroup
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref 'AWS::NoValue']
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-bastion'

  AppInstance:
    Type: AWS::EC2::Instance
    DependsOn: EfsMountTarget1
    Properties:
      InstanceType: t3.micro
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref PrivateSubnet1
      SecurityGroupIds:
        - !Ref AppSecurityGroup
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref 'AWS::NoValue']
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # Install AWS EFS Utilities
          dnf install -y amazon-efs-utils
          
          # Create Mount Directory
          mkdir -p /mnt/efs
          
          # Mount EFS via Helper (with TLS)
          mount -t efs -o tls ${EfsFileSystem}:/ /mnt/efs
          
          # Persist mount in fstab
          echo "${EfsFileSystem}:/ /mnt/efs efs defaults,_netdev,noresvport,tls 0 0" >> /etc/fstab
          
          # Write verification file with current system timestamp
          echo "Hardened EFS Layer Verification File - Created at $(date)" > /mnt/efs/w5_verification.txt
          chown ec2-user:ec2-user /mnt/efs/w5_verification.txt
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-app-private'

  # =========================================================================
  # MH4 & MH5: API Gateway + Lambda + Bedrock Integration + Throttling/Scaling
  # =========================================================================
  ChatLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockInvokeAndDynamoDBPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: '*'
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !GetAtt DynamoDbTable.Arn

  ChatLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${EnvironmentName}-chat-handler'
      Handler: index.handler
      Role: !GetAtt ChatLambdaRole.Arn
      Runtime: python3.11
      Timeout: 30
      Environment:
        Variables:
          MODEL_ID: !Ref ModelId
          TABLE_NAME: !Ref DynamoDbTable
      Code:
        ZipFile: |
          import json
          import os
          import time
          import boto3

          bedrock = boto3.client(service_name='bedrock-runtime', region_name=os.environ.get('AWS_REGION', 'us-east-1'))
          dynamodb = boto3.resource('dynamodb', region_name=os.environ.get('AWS_REGION', 'us-east-1'))

          def handler(event, context):
              try:
                  print("Received event: " + json.dumps(event))
                  
                  # Check if it is an S3 event
                  if 'Records' in event and len(event['Records']) > 0 and 's3' in event['Records'][0]:
                      s3_record = event['Records'][0]['s3']
                      bucket_name = s3_record['bucket']['name']
                      object_key = s3_record['object']['key']
                      print(f"S3 Event detected: Bucket={bucket_name}, Key={object_key}")
                      
                      # Write to DynamoDB
                      table_name = os.environ.get('TABLE_NAME', 'w5-fortress-chat-logs')
                      table = dynamodb.Table(table_name)
                      table.put_item(Item={
                          'chat_id': f"S3-UPLOAD:{object_key}",
                          'timestamp': int(time.time()),
                          'bucket': bucket_name,
                          'key': object_key,
                          'status': 'PROCESSED'
                      })
                      
                      return {
                          "statusCode": 200,
                          "body": json.dumps({"message": f"Successfully processed S3 object: {object_key}"})
                      }
                      
                  # API Gateway Chat prompt flow
                  body = json.loads(event.get('body', '{}'))
                  prompt = body.get('prompt', 'Hello')
                  
                  model_id = os.environ.get('MODEL_ID', 'amazon.nova-micro-v1:0')
                  
                  if 'titan' in model_id:
                      input_body = json.dumps({
                          "inputText": prompt,
                          "textGenerationConfig": {
                              "maxTokenCount": 2048,
                              "temperature": 0.7,
                              "topP": 0.9
                          }
                      })
                  elif 'claude' in model_id:
                      input_body = json.dumps({
                          "anthropic_version": "bedrock-2023-05-31",
                          "max_tokens": 2048,
                          "messages": [{"role": "user", "content": prompt}],
                          "temperature": 0.7
                      })
                  elif 'nova' in model_id:
                      input_body = json.dumps({
                          "inferenceConfig": {
                              "max_new_tokens": 2048,
                              "temperature": 0.7
                          },
                          "messages": [
                              {
                                  "role": "user",
                                  "content": [{"text": prompt}]
                              }
                          ]
                      })
                  else:
                      return {
                          "statusCode": 400,
                          "headers": {
                              "Content-Type": "application/json",
                              "Access-Control-Allow-Origin": "*",
                              "Access-Control-Allow-Methods": "POST,OPTIONS",
                              "Access-Control-Allow-Headers": "Content-Type,X-Amz-Date,Authorization,X-Api-Key"
                          },
                          "body": json.dumps({"error": f"Unsupported model ID: {model_id}"})
                      }
                      
                  response = bedrock.invoke_model(
                      body=input_body,
                      modelId=model_id,
                      accept='application/json',
                      contentType='application/json'
                  )
                  
                  response_body = json.loads(response.get('body').read())
                  
                  if 'titan' in model_id:
                      result = response_body.get('results')[0].get('outputText')
                  elif 'claude' in model_id:
                      result = response_body.get('content')[0].get('text')
                  elif 'nova' in model_id:
                      result = response_body.get('output').get('message').get('content')[0].get('text')
                      
                  # Log prompt to DynamoDB
                  try:
                      table_name = os.environ.get('TABLE_NAME', 'w5-fortress-chat-logs')
                      table = dynamodb.Table(table_name)
                      table.put_item(Item={
                          'chat_id': f"CHAT:{context.aws_request_id}",
                          'timestamp': int(time.time()),
                          'prompt': prompt[:100],
                          'response': result[:100]
                      })
                  except Exception as db_err:
                      print("Error writing to DynamoDB:", str(db_err))

                  return {
                      "statusCode": 200,
                      "headers": {
                          "Content-Type": "application/json",
                          "Access-Control-Allow-Origin": "*",
                          "Access-Control-Allow-Methods": "POST,OPTIONS",
                          "Access-Control-Allow-Headers": "Content-Type,X-Amz-Date,Authorization,X-Api-Key"
                      },
                      "body": json.dumps({"response": result})
                  }
              except Exception as e:
                  print("Error invoking Bedrock:", str(e))
                  return {
                      "statusCode": 500,
                      "headers": {
                          "Content-Type": "application/json",
                          "Access-Control-Allow-Origin": "*",
                          "Access-Control-Allow-Methods": "POST,OPTIONS",
                          "Access-Control-Allow-Headers": "Content-Type,X-Amz-Date,Authorization,X-Api-Key"
                      },
                      "body": json.dumps({"error": str(e)})
                  }

  # REST API Gateway
  ChatApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${EnvironmentName}-api'
      Description: API Gateway fronting Bedrock Chat Lambda
      EndpointConfiguration:
        Types:
          - REGIONAL

  ChatApiResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt ChatApi.RootResourceId
      PathPart: chat
      RestApiId: !Ref ChatApi

  ChatApiMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      ApiKeyRequired: true
      AuthorizationType: NONE
      HttpMethod: POST
      ResourceId: !Ref ChatApiResource
      RestApiId: !Ref ChatApi
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ChatLambda.Arn}/invocations'

  # Mock integration for CORS Preflight OPTIONS
  ChatApiOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      AuthorizationType: NONE
      HttpMethod: OPTIONS
      ResourceId: !Ref ChatApiResource
      RestApiId: !Ref ChatApi
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,x-api-key'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  LambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt ChatLambda.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ChatApi}/*/POST/chat'

  ChatApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ChatApiMethod
      - ChatApiOptionsMethod
    Properties:
      RestApiId: !Ref ChatApi

  ChatApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      StageName: prod
      Description: Production Stage
      RestApiId: !Ref ChatApi
      DeploymentId: !Ref ChatApiDeployment

  # Usage Plan (MH4: Throttling Configuration)
  ChatApiUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Properties:
      UsagePlanName: !Sub '${EnvironmentName}-usage-plan'
      Description: Standard usage plan for Chat API
      ApiStages:
        - ApiId: !Ref ChatApi
          Stage: !Ref ChatApiStage
      Throttle:
        RateLimit: 1 # 1 request per second
        BurstLimit: 1 # Burst of 1 request
      Quota:
        Limit: 100
        Period: DAY

  # API Key Creation
  ChatApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: !Sub '${EnvironmentName}-api-key'
      Description: API Key for Chat API clients
      Enabled: true

  UploadBucket:
    Type: AWS::S3::Bucket
    DependsOn: LambdaPermissionForS3
    Properties:
      BucketName: !Sub '${EnvironmentName}-uploads-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt ChatLambda.Arn

  LambdaPermissionForS3:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt ChatLambda.Arn
      Principal: s3.amazonaws.com
      SourceArn: !Sub 'arn:aws:s3:::${EnvironmentName}-uploads-${AWS::AccountId}'

  ChatApiUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref ChatApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref ChatApiUsagePlan

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub '${EnvironmentName}-monthly-budget'
        BudgetLimit:
          Amount: 1
          Unit: USD
        BudgetType: COST
        TimeUnit: MONTHLY
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref NotificationEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref NotificationEmail

  StaticWebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${EnvironmentName}-website-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      WebsiteConfiguration:
        IndexDocument: index.html

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${EnvironmentName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  StaticWebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StaticWebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub 'arn:aws:s3:::${StaticWebsiteBucket}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebsiteDistribution}'

  WebsiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt StaticWebsiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none

Outputs:
  VpcId:
    Description: VPC ID
    Value: !Ref Vpc
    Export:
      Name: !Sub '${AWS::StackName}-VpcId'

  BastionPublicIp:
    Description: Public IP of the Bastion Host
    Value: !GetAtt BastionInstance.PublicIp

  AppPrivateIp:
    Description: Private IP of the Private App Host
    Value: !GetAtt AppInstance.PrivateIp

  EfsFileSystemId:
    Description: EFS File System ID
    Value: !Ref EfsFileSystem

  ApiEndpoint:
    Description: API Gateway REST Endpoint URL
    Value: !Sub 'https://${ChatApi}.execute-api.${AWS::Region}.amazonaws.com/prod/chat'

  ApiKeyId:
    Description: API Key ID (retrieve value via AWS console/CLI)
    Value: !Ref ChatApiKey

  UploadBucketName:
    Description: S3 Bucket Name for uploading files to test MH5
    Value: !Ref UploadBucket

  WebsiteURL:
    Description: CloudFront Distribution Domain Name
    Value: !GetAtt WebsiteDistribution.DomainName

  StaticWebsiteBucketName:
    Description: S3 Bucket Name for static website hosting
    Value: !Ref StaticWebsiteBucket
